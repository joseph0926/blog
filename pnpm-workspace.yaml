packages:
  - apps/*
  - packages/*

overrides:
  postcss: ^8.5.23
  'uuid@<11.1.1': ^11.1.1
  tmp: ^0.2.4
  'vite@>=8.0.0 <8.1.6': ^8.1.6
  'js-yaml@<3.15.2': ^3.15.2
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  'browserslist@<4.28.7': ^4.28.7
  'nanoid@<3.3.18': ^3.3.18
  'source-map-js@<1.2.2': ^1.2.2
  'baseline-browser-mapping@<2.11.0': ^2.11.0

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  es5-ext: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - '@vercel/speed-insights'
  - es5-ext
  - esbuild
  - sharp
  - unrs-resolver
